[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-simulation-exercise"
version = "0.1.0"
description = "A local SMS alert simulation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.setuptools.packages.find]
include = ["services*", "shared*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["services", "shared", "tests/integration"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
